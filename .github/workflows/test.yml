name: Run tests (Kotlin with Supabase)

on: [push]

jobs:
  test:
    name: Run tests (Kotlin with Supabase)
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: 1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start Supabase
        run: |
          if [ ! -d "supabase" ]; then
            supabase init
          fi
          supabase start
          echo "Waiting for all Supabase services to be ready..."
          for i in {1..60}; do
            if supabase status >/dev/null 2>&1; then
              echo "All Supabase services are ready!"
              break
            fi
            sleep 5
          done

      - name: Export Supabase Keys to Environment
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | tr -d '"' >> "$GITHUB_ENV"

      - name: Configure local.properties
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          echo "SUPABASE_TEST_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_TEST_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
          echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Kotlin tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon -Dorg.gradle.java.home=$JAVA_HOME

      - name: Stop Supabase
        if: always()
        run: supabase stop || true